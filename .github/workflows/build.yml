name: Build PromiseLink Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.9.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:h5

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: |
          pyinstaller promiselink.spec --clean --noconfirm

      - name: Create DMG (macOS)
        run: |
          # Create a DMG installer
          hdiutil create -volname "PromiseLink" -srcfolder dist/PromiseLink.app -ov -format UDZO "dist/PromiseLink-${{ steps.version.outputs.version }}-mac.dmg"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromiseLink-${{ steps.version.outputs.version }}-mac.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromiseLink-macos-${{ steps.version.outputs.version }}
          path: dist/PromiseLink-${{ steps.version.outputs.version }}-mac.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:h5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: |
          pyinstaller promiselink.spec --clean --noconfirm

      - name: Rename executable
        shell: bash
        run: |
          mv dist/PromiseLink.exe "dist/PromiseLink-${{ steps.version.outputs.version }}-windows.exe"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromiseLink-${{ steps.version.outputs.version }}-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromiseLink-windows-${{ steps.version.outputs.version }}
          path: dist/PromiseLink-${{ steps.version.outputs.version }}-windows.exe
