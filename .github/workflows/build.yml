name: Build PromiseLink Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.9.0)'
        required: false

permissions:
  contents: write
  id-token: write  # needed for OIDC-based server deployment

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Job 1: macOS DMG ────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:h5

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: |
          pyinstaller promiselink.spec --clean --noconfirm

      - name: Create DMG (macOS)
        run: |
          hdiutil create -volname "PromiseLink" \
            -srcfolder dist/PromiseLink.app \
            -ov -format UDZO \
            "dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromiseLink-macos-${{ steps.version.outputs.short_version }}
          path: dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg

  # ── Job 2: Windows EXE ───────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build:h5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        shell: bash
        run: |
          # promiselink.spec 将 a.binaries/a.datas 直接传入 EXE()，为 onefile 模式，
          # 在 Windows 上产出单个 dist/PromiseLink.exe（非 onedir 目录）。
          pyinstaller promiselink.spec --clean --noconfirm
          ls -lh dist/PromiseLink.exe

      - name: Rename EXE to versioned artifact
        shell: bash
        run: |
          # 直接重命名为下载页引用的 .exe 文件名，避免 zip 往返
          VERSION=${{ steps.version.outputs.short_version }}
          mv dist/PromiseLink.exe "dist/PromiseLink-${VERSION}-windows.exe"
          ls -lh "dist/PromiseLink-${VERSION}-windows.exe"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromiseLink-${{ steps.version.outputs.short_version }}-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromiseLink-windows-${{ steps.version.outputs.short_version }}
          path: dist/PromiseLink-${{ steps.version.outputs.short_version }}-windows.exe

  # ── Job 3: Deploy to server (after all builds succeed) ─────────────────────
  deploy-to-server:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PromiseLink-macos-${{ steps.version.outputs.short_version }}
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PromiseLink-windows-${{ steps.version.outputs.short_version }}
          path: artifacts/

      - name: Verify artifacts
        run: |
          echo "=== Artifacts ===" && ls -lh artifacts/

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: artifacts/*
          target: /opt/promiselink-pro/website/downloads/
          strip_components: 0
          overwrite: true
          command: |
            # 直接上传 .dmg/.exe（不再有 zip，无需 unzip）
            ls -lh /opt/promiselink-pro/website/downloads/
          timeout: 300

      - name: Update download page on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command: |
            # Update download.html to point to local files (not GitHub CDN)
            WEBSITE=/opt/promiselink-pro/website
            VERSION=${{ steps.version.outputs.short_version }}

            # Update macOS DMG link to local file
            if [ -f $WEBSITE/downloads/PromiseLink-${VERSION}-mac.dmg ]; then
              sed -i "s|https://github.com/lulin70/PromiseLink/releases/download/v${VERSION}/PromiseLink-${VERSION}-mac.dmg|downloads/PromiseLink-${VERSION}-mac.dmg|g" \
                $WEBSITE/download.html 2>/dev/null || true
              echo "macOS DMG link updated to local"
            fi

            # Update Windows EXE link to local file (if .exe exists after unzip)
            if [ -f $WEBSITE/downloads/PromiseLink-${VERSION}-windows.exe ]; then
              sed -i "s|https://github.com/lulin70/PromiseLink/releases/download/v${VERSION}/PromiseLink-${VERSION}-windows.exe|downloads/PromiseLink-${VERSION}-windows.exe|g" \
                $WEBSITE/download.html 2>/dev/null || true
              echo "Windows EXE link updated to local"
            fi

            # Reload nginx to serve new static files
            nginx -t && nginx -s reload || echo "nginx reload skipped"
            echo "=== Server downloads ===" && ls -lh $WEBSITE/downloads/
          timeout: 60
