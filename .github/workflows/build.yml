name: Build PromiseLink Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.9.0)'
        required: false

permissions:
  contents: write
  id-token: write  # needed for OIDC-based server deployment

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Job 1: macOS DMG ────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:h5

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT
          # Fail-closed: release tag MUST match VERSION file (case-insensitive,
          # allowing optional leading 'v' on the tag side). Prevents the
          # "tag v1.0-rc1 + VERSION 1.1.0" class of mismatch that previously
          # left download.html pointing at the wrong files for weeks.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            TAG_LC=$(echo "$TAG_VERSION" | tr '[:upper:]' '[:lower:]')
            VER_LC=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
            if [ "$TAG_LC" != "$VER_LC" ]; then
              echo "::error::Release tag version ($TAG_VERSION) does not match VERSION file ($VERSION). Aborting deploy."
              exit 1
            fi
          fi

      - name: Build with PyInstaller
        run: |
          pyinstaller promiselink.spec --clean --noconfirm

      - name: Create DMG (macOS)
        run: |
          hdiutil create -volname "PromiseLink" \
            -srcfolder dist/PromiseLink.app \
            -ov -format UDZO \
            "dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromiseLink-macos-${{ steps.version.outputs.short_version }}
          path: dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg

  # ── Job 2: Windows EXE ───────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build:h5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT
          # Fail-closed: release tag MUST match VERSION file
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            TAG_LC=$(echo "$TAG_VERSION" | tr '[:upper:]' '[:lower:]')
            VER_LC=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
            if [ "$TAG_LC" != "$VER_LC" ]; then
              echo "::error::Release tag version ($TAG_VERSION) does not match VERSION file ($VERSION). Aborting build."
              exit 1
            fi
          fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          # promiselink.spec 将 a.binaries/a.datas 直接传入 EXE()，为 onefile 模式，
          # 在 Windows 上产出单个 dist/PromiseLink.exe（非 onedir 目录）。
          pyinstaller promiselink.spec --clean --noconfirm
          ls -lh dist/PromiseLink.exe

      - name: Rename EXE to versioned artifact
        shell: bash
        run: |
          # 直接重命名为下载页引用的 .exe 文件名，避免 zip 往返
          VERSION=${{ steps.version.outputs.short_version }}
          mv dist/PromiseLink.exe "dist/PromiseLink-${VERSION}-windows.exe"
          ls -lh "dist/PromiseLink-${VERSION}-windows.exe"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromiseLink-${{ steps.version.outputs.short_version }}-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromiseLink-windows-${{ steps.version.outputs.short_version }}
          path: dist/PromiseLink-${{ steps.version.outputs.short_version }}-windows.exe

  # ── Job 3: Deploy to server (after all builds succeed) ─────────────────────
  deploy-to-server:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT
          # Fail-closed: release tag MUST match VERSION file
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$(echo "$TAG_VERSION" | tr '[:upper:]' '[:lower:]')" != "$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "::error::Release tag version ($TAG_VERSION) does not match VERSION file ($VERSION). Aborting deploy."
              exit 1
            fi
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PromiseLink-macos-${{ steps.version.outputs.short_version }}
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PromiseLink-windows-${{ steps.version.outputs.short_version }}
          path: artifacts/

      - name: Verify artifacts
        run: |
          echo "=== Artifacts ===" && ls -lh artifacts/

      # 官网页面内容的唯一 owner 是 PromiseLink-Pro（见
      # PromiseLink-Pro/docs/review/PROJECT_REVIEW_20260918_FINDINGS.md §6）：
      # 本仓库只产出安装包本体并上传到下面的规范源；Pro 的 deploy-website.sh 负责把
      # 安装包同步进 nginx 实际服务目录，并改写 download.html / sw.js 的版本号。
      # 历史问题：此处曾直接 sed 改写 /opt/promiselink-pro/website/download.html ——
      # 既写错目录（nginx 实际服务 /opt/promiselink/website，见 P0-0），又与 Pro 形成双 owner。
      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: artifacts/*
          target: /opt/promiselink-pro/website/downloads/
          strip_components: 1
          overwrite: true
          timeout: 300s
