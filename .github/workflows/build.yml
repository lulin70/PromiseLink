name: Build PromiseLink Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.9.0)'
        required: false

permissions:
  contents: write
  id-token: write  # needed for OIDC-based server deployment

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Job 1: macOS DMG ────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:h5

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT
          # Fail-closed: release tag MUST match VERSION file (case-insensitive,
          # allowing optional leading 'v' on the tag side). Prevents the
          # "tag v1.0-rc1 + VERSION 1.1.0" class of mismatch that previously
          # left download.html pointing at the wrong files for weeks.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            TAG_LC=$(echo "$TAG_VERSION" | tr '[:upper:]' '[:lower:]')
            VER_LC=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
            if [ "$TAG_LC" != "$VER_LC" ]; then
              echo "::error::Release tag version ($TAG_VERSION) does not match VERSION file ($VERSION). Aborting deploy."
              exit 1
            fi
          fi

      - name: Build with PyInstaller
        run: |
          pyinstaller promiselink.spec --clean --noconfirm

      - name: Create DMG (macOS)
        run: |
          hdiutil create -volname "PromiseLink" \
            -srcfolder dist/PromiseLink.app \
            -ov -format UDZO \
            "dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromiseLink-macos-${{ steps.version.outputs.short_version }}
          path: dist/PromiseLink-${{ steps.version.outputs.short_version }}-mac.dmg

  # ── Job 2: Windows EXE ───────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build:h5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT
          # Fail-closed: release tag MUST match VERSION file
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            TAG_LC=$(echo "$TAG_VERSION" | tr '[:upper:]' '[:lower:]')
            VER_LC=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
            if [ "$TAG_LC" != "$VER_LC" ]; then
              echo "::error::Release tag version ($TAG_VERSION) does not match VERSION file ($VERSION). Aborting build."
              exit 1
            fi
          fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          # promiselink.spec 将 a.binaries/a.datas 直接传入 EXE()，为 onefile 模式，
          # 在 Windows 上产出单个 dist/PromiseLink.exe（非 onedir 目录）。
          pyinstaller promiselink.spec --clean --noconfirm
          ls -lh dist/PromiseLink.exe

      - name: Rename EXE to versioned artifact
        shell: bash
        run: |
          # 直接重命名为下载页引用的 .exe 文件名，避免 zip 往返
          VERSION=${{ steps.version.outputs.short_version }}
          mv dist/PromiseLink.exe "dist/PromiseLink-${VERSION}-windows.exe"
          ls -lh "dist/PromiseLink-${VERSION}-windows.exe"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PromiseLink-${{ steps.version.outputs.short_version }}-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromiseLink-windows-${{ steps.version.outputs.short_version }}
          path: dist/PromiseLink-${{ steps.version.outputs.short_version }}-windows.exe

  # ── Job 3: Deploy to server (after all builds succeed) ─────────────────────
  deploy-to-server:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "short_version=${VERSION#v}" >> $GITHUB_OUTPUT
          # Fail-closed: release tag MUST match VERSION file
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$(echo "$TAG_VERSION" | tr '[:upper:]' '[:lower:]')" != "$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "::error::Release tag version ($TAG_VERSION) does not match VERSION file ($VERSION). Aborting deploy."
              exit 1
            fi
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PromiseLink-macos-${{ steps.version.outputs.short_version }}
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PromiseLink-windows-${{ steps.version.outputs.short_version }}
          path: artifacts/

      - name: Verify artifacts
        run: |
          echo "=== Artifacts ===" && ls -lh artifacts/

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: artifacts/*
          target: /opt/promiselink-pro/website/downloads/
          strip_components: 1
          overwrite: true
          timeout: 300s

      - name: Update download page on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -e
            WEBSITE=/opt/promiselink-pro/website
            VERSION=${{ steps.version.outputs.short_version }}

            echo "=== Deploying version: $VERSION ==="

            # Backup once per release (don't overwrite existing backup).
            if [ ! -f "$WEBSITE/download.html.bak.$VERSION" ]; then
              cp -p "$WEBSITE/download.html" "$WEBSITE/download.html.bak.$VERSION"
              echo "Backed up download.html -> download.html.bak.$VERSION"
            else
              echo "Backup already exists: download.html.bak.$VERSION"
            fi

            # Regex-based rewrite: catches ANY stale version reference
            # (PromiseLink-0.9.9-..., PromiseLink-1.0.5-..., etc.) and
            # replaces it with the current VERSION. This is structurally
            # immune to "the website still says v0.9.9" / "stale 1.0.5"
            # classes of bug — the bug can never recur because the sed
            # matches any digit/.-rc prefix, not one exact string.
            cd "$WEBSITE"
            sed -i -E \
              -e "s|PromiseLink-[0-9][0-9a-zA-Z.\\-]*-mac\\.dmg|PromiseLink-${VERSION}-mac.dmg|g" \
              -e "s|PromiseLink-[0-9][0-9a-zA-Z.\\-]*-windows\\.exe|PromiseLink-${VERSION}-windows.exe|g" \
              -e "s|https://github\\.com/lulin70/PromiseLink/releases/download/v[0-9][0-9a-zA-Z.\\-]*/PromiseLink-[0-9][0-9a-zA-Z.\\-]*-mac\\.dmg|downloads/PromiseLink-${VERSION}-mac.dmg|g" \
              -e "s|https://github\\.com/lulin70/PromiseLink/releases/download/v[0-9][0-9a-zA-Z.\\-]*/PromiseLink-[0-9][0-9a-zA-Z.\\-]*-windows\\.exe|downloads/PromiseLink-${VERSION}-windows.exe|g" \
              -e "s|约 82 MB · v[0-9][0-9a-zA-Z.\\-]*|约 82 MB · v${VERSION}|g" \
              -e "s|约 42 MB · v[0-9][0-9a-zA-Z.\\-]*|约 42 MB · v${VERSION}|g" \
              download.html

            # Self-check: the new links MUST now reference the current VERSION.
            if ! grep -q "PromiseLink-${VERSION}-mac.dmg" download.html; then
              echo "::error::download.html still does not reference PromiseLink-${VERSION}-mac.dmg after rewrite."
              exit 1
            fi
            if ! grep -q "PromiseLink-${VERSION}-windows.exe" download.html; then
              echo "::error::download.html still does not reference PromiseLink-${VERSION}-windows.exe after rewrite."
              exit 1
            fi

            # Self-check: no stale version references should remain.
            STALE=$(grep -oE 'PromiseLink-[0-9][0-9a-zA-Z.\\-]*-(mac\.dmg|windows\.exe)' download.html | grep -v "PromiseLink-${VERSION}-" || true)
            if [ -n "$STALE" ]; then
              echo "::error::Stale artifact references still present in download.html:"
              echo "$STALE"
              exit 1
            fi

            nginx -t && nginx -s reload || echo "nginx reload skipped"
            echo "=== Server downloads ===" && ls -lh "$WEBSITE/downloads/"
            echo "=== Final references in download.html ==="
            grep -nE 'PromiseLink-[0-9][0-9a-zA-Z.\\-]*-(mac\.dmg|windows\.exe)|v[0-9][0-9a-zA-Z.\\-]*' download.html | grep -v 'data-' | head -20
