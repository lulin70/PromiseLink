name: PromiseLink CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 2 AM UTC
    - cron: "0 2 * * *"

# project_memory hard constraint:
# "CI must include concurrency control to cancel in-progress runs for the same PR"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linting
        run: ruff check src/ tests/

      - name: Contract consistency (W1, zero-cost push gate)
        run: python scripts/generate_semantic_contract.py --check

      # 版本号单一事实源 = VERSION 文件；其余位置必须一致
      # （防 P1-2 类漂移复发：frontend/package.json 曾长期停留在 0.9.0）
      - name: Version consistency gate
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          version = (root / "VERSION").read_text().strip()
          checks = {
              "pyproject.toml": re.search(
                  r'^version = "([^"]+)"', (root / "pyproject.toml").read_text(), re.M
              ).group(1),
              "src/promiselink/__init__.py": re.search(
                  r'__version__ = "([^"]+)"', (root / "src/promiselink/__init__.py").read_text()
              ).group(1),
              "frontend/package.json": json.loads((root / "frontend/package.json").read_text())["version"],
              "frontend/package-lock.json": json.loads((root / "frontend/package-lock.json").read_text())["version"],
          }
          for k, v in checks.items():
              print(f"  {k}: {v}")
          bad = {k: v for k, v in checks.items() if v != version}
          if bad:
              print(f"::error::版本号不一致（VERSION={version}）: {bad}")
              sys.exit(1)
          print(f"  ✓ 版本号一致: {version}")
          PY

      - name: Run type checking
        run: python3 -m mypy src/promiselink --ignore-missing-imports

      - name: Run security audit
        run: pip-audit --desc --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-3447  # ecdsa Minerva timing attack (side-channel out of scope) + setuptools Unicode normalization (macOS sdist only, PromiseLink ships as a desktop package not sdist)

      - name: Run tests
        env:
          TEST_MODE: "true"
          LLM_PROVIDER: "mock"
          EMBEDDING_PROVIDER: "local"
          LLM_API_KEY: "test-key-for-ci"
          SECRET_KEY: "ci-test-secret-key-min-32-chars-long"
          REDIS_ENABLED: "false"
          TZ: Asia/Shanghai
        run: |
          # 排除负载测试:coverage 插桩会使性能测量失效 (100 并发 P95 从 10ms 膨胀到 1185ms)
          # 负载测试在下方 "Run load tests" step 单独无 coverage 执行
          pytest tests/ -v --cov=src/promiselink --cov-report=xml --cov-report=term-missing --cov-fail-under=80 --ignore=tests/test_load_real.py -k "not embedding_provider_local and not embedding_provider_similar and not full_embedding_to_similarity"

      - name: Run load tests (no coverage — performance measurements require clean instrumentation)
        env:
          TEST_MODE: "true"
          LLM_PROVIDER: "mock"
          EMBEDDING_PROVIDER: "local"
          LLM_API_KEY: "test-key-for-ci"
          SECRET_KEY: "ci-test-secret-key-min-32-chars-long"
          REDIS_ENABLED: "false"
          TZ: Asia/Shanghai
        run: |
          pytest tests/test_load_real.py -v --no-cov -o addopts="" --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  e2e:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start PromiseLink server
        env:
          TEST_MODE: "true"
          LLM_PROVIDER: "mock"
          EMBEDDING_PROVIDER: "local"
          LLM_API_KEY: "test-key-for-ci"
          SECRET_KEY: "ci-test-secret-key-min-32-chars-long"
          REDIS_ENABLED: "false"
          TZ: Asia/Shanghai
        run: |
          python3 -m alembic upgrade head
          python3 -m uvicorn promiselink.main:app --host 0.0.0.0 --port 8000 --log-level debug > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Server is ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/api/v1/health || (echo "Server failed to start" && cat /tmp/server.log && exit 1)

      - name: Run E2E tests
        run: python3 scripts/e2e/e2e_basic_test.py

      - name: Run E2E user operations tests
        run: python3 -m pytest scripts/e2e/e2e_user_operations_full.py -v --tb=short

      - name: Display server logs
        if: always()
        run: cat /tmp/server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
            rm -f /tmp/server.pid
          fi

  playwright-ui:
    name: Playwright UI E2E
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Start PromiseLink backend
        env:
          DATABASE_URL: sqlite:///./playwright_test.db
          TEST_MODE: "true"
          LLM_PROVIDER: "mock"
          EMBEDDING_PROVIDER: "local"
          LLM_API_KEY: "test-key-for-ci"
          SECRET_KEY: "ci-test-secret-key-min-32-chars-long"
          REDIS_ENABLED: "false"
          TZ: Asia/Shanghai
        run: |
          python3 -m alembic upgrade head
          python3 -m uvicorn promiselink.main:app --host 0.0.0.0 --port 8000 --log-level warning > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend is ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/api/v1/health || (echo "Backend failed to start" && cat /tmp/server.log && exit 1)

      - name: Run Playwright UI E2E tests
        env:
          CI: true
        working-directory: frontend
        run: npx playwright test --reporter=line --retries=1

      - name: Display backend logs
        if: always()
        run: cat /tmp/server.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
            rm -f /tmp/server.pid
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  e2e-nightly:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 仅夜间定时运行：e2e-nightly 需要真实 LLM API key，CI 环境无法通过。
    # 每次 push 都跑会浪费 30 分钟 CI 时间并可能导致 concurrency 取消。
    # 基本 E2E 由 e2e job 覆盖（push 时运行）。
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install httpx for E2E tests
        run: pip install httpx

      - name: Start PromiseLink server
        env:
          TEST_MODE: "true"
          LLM_PROVIDER: "mock"
          EMBEDDING_PROVIDER: "local"
          LLM_API_KEY: "test-key-for-ci"
          SECRET_KEY: "ci-test-secret-key-min-32-chars-long"
          REDIS_ENABLED: "false"
          TZ: Asia/Shanghai
        run: |
          python3 -m alembic upgrade head
          python3 -m uvicorn promiselink.main:app --host 0.0.0.0 --port 8000 --log-level debug > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Server is ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/api/v1/health || (echo "Server failed to start" && cat /tmp/server.log && exit 1)

      - name: Run E2E basic test
        run: python3 scripts/e2e/e2e_basic_test.py

      - name: Run E2E smoke test
        run: python3 scripts/e2e/e2e_smoke_test.py

      - name: Run E2E user journey
        run: python3 scripts/e2e/e2e_user_journey.py

      - name: Run E2E full user journey
        run: python3 scripts/e2e/e2e_full_user_journey.py

      - name: Display server logs
        if: always()
        run: cat /tmp/server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
            rm -f /tmp/server.pid
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build:h5

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json -ll

      - name: Run pip-audit
        run: pip-audit --desc --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-3447  # ecdsa Minerva timing attack (side-channel out of scope) + setuptools Unicode normalization (macOS sdist only, PromiseLink ships as a desktop package not sdist)

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

# 注：build-and-push job 已移除（2026-09-19）
# 原因：基础版交付链统一为 PyInstaller 桌面包（macOS .dmg / Windows .exe），
#       Docker 镜像（ghcr.io）这一分发路径已无任何消费者（install_basic.sh 一并删除）。
#       镜像 tag 曾长期停留在 0.9.0（陈旧 pin，滞后 6 周），并造成「CI 绿=用户可安装」的
#       门禁遮挡假象；收敛后由 release 工作流的桌面包产物承担交付验证。
# 关联：deploy-staging job 已移除（2026-07-12）——基础版禁止云端部署（硬约束）。
# 决策记录：PromiseLink-Pro/docs/review/PROJECT_REVIEW_20260918_FINDINGS.md §9
