# Golden baseline (W2, FR-5) — LLM 解析基准，informational 不阻塞合入。
# 触发：手动 workflow_dispatch + 每周定时（PRD 裁决②：push 层为纯结构校验，
# 全量 LLM 基准保持手动/定时以控成本）。需要 secret: LLM_API_KEY。
name: golden-baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run golden baseline (LLM mode)
        env:
          GOLDEN_RUN_LLM: "1"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          pytest tests/golden/ -m "" -q --no-cov \
            -k "LLMBaseline" --tb=no -v 2>&1 | tee baseline_output.txt

      - name: Archive baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-baseline-${{ github.run_id }}
          path: baseline_output.txt
          retention-days: 90
